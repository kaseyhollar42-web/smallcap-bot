# ==================================================================
#  Small-Cap Momentum Bot settings. Edit here; no code changes needed.
# ==================================================================

# true = Alpaca paper trading (fake money). Leave it until you've watched it for weeks.
paper: true

# ---------- money ----------
budget: 100000               # how much the bot is allowed to trade with (the full paper account)

# What your Alpaca paper account STARTED with. New Alpaca paper accounts
# start at 100000. If yours started with a different amount, set this AND
# `budget` to that amount. (If budget is smaller than this, the bot leaves the
# difference untouched and only plays with `budget` dollars.)
account_start_value: 100000

# ---------- the safety floor ----------
floor: 20000                 # if the bot's money falls to this, it stops (20% of budget)
on_floor: sell_all           # sell_all = sell everything & stop  |  stop_buying = keep positions, no new buys
# Once stopped, it stays stopped until you run "resume" (see README).

# ---------- what it can buy ----------
