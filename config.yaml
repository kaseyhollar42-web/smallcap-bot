  - IOVA   # Iovance
  - RXRX   # Recursion - AI drug discovery

# Daily scanner: also considers today's top gainers & most-active stocks.
# They still have to pass every filter below before the bot will buy.
scanner:
  enabled: true
  top_gainers: 20
  most_active: 20
  max_dollar_volume: 1500000000   # skip giants/ETFs that trade > $1.5B a day (keeps it small-cap)
  exclude: [SPY, QQQ, IWM, DIA, TQQQ, SQQQ, SOXL, SOXS, TSLL, NVDL, UVXY, VXX, TLT, GLD, SLV]

# ---------- filters (a stock must pass ALL of these) ----------
filters:
  min_price: 3                    # no penny stocks
  min_dollar_volume: 5000000      # trades at least $5M a day on average (can get in and out)
  min_history_days: 63            # at least ~3 months of trading history

# ---------- how stocks are ranked ----------
momentum:
  # score = weighted mix of 1-month, 3-month and 6-month price gains
  weights: {r21: 0.3, r63: 0.5, r126: 0.2}
  require_positive: true          # must be up over the last 3 months to be bought
  buy_rank: 5                     # only buy stocks ranked in the top 5
  hold_rank: 15                   # sell a holding once it falls out of the top 15

# ---------- position sizing ----------
positions:
  max_positions: 5                # at most 5 stocks at once (~$20,000 each)
  max_position_pct: 25            # never more than 25% of the bot's money in one stock
  min_order: 5                    # skip orders smaller than $5

# ---------- risk ----------
risk:
  stop_loss_pct: 15               # sell any stock that falls 15% below what we paid
  daily_loss_limit_pct: 15        # if the bot is down 15% today, no new buys today
  trade_after: "10:00"            # (ET) no buying in the chaotic first 30 minutes

# Market data: "sip" = full market data (free on Alpaca for past days).
# Falls back to "iex" automatically if your plan doesn't allow it.
data_feed: sip

# ---------- backtest ----------
backtest:
  years: 2
  slippage_pct: 0.2               # small caps cost more to trade; assume 0.2% per trade
  benchmark: IWM                  # Russell 2000 small-cap index fund
