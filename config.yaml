  - QUIK   # QuickLogic - programmable chips, defense/edge AI
  - AXTI   # AXT - semiconductor substrates
  - MXL    # MaxLinear - connectivity chips
  - INOD   # Innodata - AI training data
  - SOUN   # SoundHound AI - voice AI
  - BBAI   # BigBear.ai - government AI analytics
  - PLPC   # Preformed Line Products - grid hardware for AI power demand
  # AI data centers
  - IREN   # IREN - AI cloud / data centers
  - APLD   # Applied Digital - AI data centers
  # Quantum computing
  - IONQ   # IonQ
  - QBTS   # D-Wave Quantum
  - RGTI   # Rigetti Computing
  - QNT    # Quantinuum (IPO June 2026)
  # Space
  - ASTS   # AST SpaceMobile - satellite-to-phone
  - LUNR   # Intuitive Machines - lunar
  - PL     # Planet Labs - earth imaging
  - RDW    # Redwire - space infrastructure
  - BKSY   # BlackSky - earth imaging
  - SPIR   # Spire Global - satellite data
